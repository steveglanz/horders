# Merges a pull request on its own once it carries the `automerge` label and CI
# is green, and flags open pull requests that conflict with main.
#
# How to use: add the `automerge` label to a PR. When the CI workflow passes on
# the PR's latest commit, this squash-merges it into main and deletes the
# branch. A new push resets the wait: only a green run on the current head
# merges. Remove the label to stop it.
#
# Conflicts: after every push to main, CI run and PR update, each open PR into main is checked. One
# that no longer merges cleanly gets the `conflict` label and one comment, so
# its team (who watch their PRs) can merge main into it. The label comes off
# once the PR merges cleanly again.
name: Automerge

on:
  pull_request:
    types: [labeled, synchronize, reopened, ready_for_review]
  workflow_run:
    workflows: [CI]
    types: [completed]
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: read

concurrency:
  group: automerge
  cancel-in-progress: false

jobs:
  merge:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            // Which PRs to look at: the PR from the event, or the PRs whose head ran CI.
            let numbers = [];
            if (context.eventName === 'pull_request') numbers = [context.payload.pull_request.number];
            else {
              const run = context.payload.workflow_run;
              numbers = (run.pull_requests || []).map((p) => p.number);
              if (!numbers.length) {
                const { data } = await github.rest.repos.listPullRequestsAssociatedWithCommit({ owner, repo, commit_sha: run.head_sha });
                numbers = data.filter((p) => p.state === 'open').map((p) => p.number);
              }
            }
            for (const number of numbers) {
              const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: number });
              const why = (m) => core.info(`#${number}: ${m}`);
              if (pr.state !== 'open') { why('not open'); continue; }
              if (!pr.labels.some((l) => l.name === 'automerge')) { why('no automerge label'); continue; }
              if (pr.draft) { why('draft'); continue; }
              if (pr.base.ref !== 'main') { why(`base is ${pr.base.ref}`); continue; }
              if (pr.head.repo?.full_name !== `${owner}/${repo}`) { why('from a fork'); continue; }
              // CI must have passed on this exact commit.
              const { data: runs } = await github.rest.actions.listWorkflowRunsForRepo({ owner, repo, head_sha: pr.head.sha, event: 'pull_request', per_page: 50 });
              const ci = runs.workflow_runs.filter((r) => r.name === 'CI');
              if (!ci.length) { why('CI has not run on the head commit yet'); continue; }
              if (ci.some((r) => r.status !== 'completed')) { why('CI still running'); continue; }
              if (!ci.every((r) => r.conclusion === 'success')) { why('CI did not pass'); continue; }
              if (pr.mergeable === false) { why('has a merge conflict'); continue; }
              try {
                // sha: refuse if someone pushed after the green run.
                await github.rest.pulls.merge({ owner, repo, pull_number: number, merge_method: 'squash', sha: pr.head.sha });
                why('merged');
                await github.rest.git.deleteRef({ owner, repo, ref: `heads/${pr.head.ref}` }).catch((e) => why(`branch kept: ${e.message}`));
              } catch (e) {
                core.warning(`#${number}: merge refused: ${e.message}`);
              }
            }

  conflicts:
    # Runs after every event, including right after the merge job lands a PR:
    # a merge made with the workflow token may not start a new push run on its own.
    needs: merge
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            await github.rest.issues.createLabel({ owner, repo, name: 'conflict', color: 'b60205', description: 'Conflicts with main: merge main into this branch' }).catch(() => {});
            const prs = await github.paginate(github.rest.pulls.list, { owner, repo, state: 'open', base: 'main', per_page: 100 });
            for (const p of prs) {
              // GitHub works out mergeability in the background; ask a few times.
              let pr;
              for (let i = 0; i < 6; i++) {
                ({ data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: p.number }));
                if (pr.mergeable !== null) break;
                await new Promise((r) => setTimeout(r, 5000));
              }
              const has = pr.labels.some((l) => l.name === 'conflict');
              if (pr.mergeable === false && !has) {
                await github.rest.issues.addLabels({ owner, repo, issue_number: pr.number, labels: ['conflict'] });
                await github.rest.issues.createComment({ owner, repo, issue_number: pr.number,
                  body: `This PR now conflicts with \`main\`. Please merge \`main\` into \`${pr.head.ref}\` and resolve the conflicts. Automerge waits until it merges cleanly.\n\n---\n_Posted by the Automerge workflow_` });
                core.info(`#${pr.number}: conflict flagged`);
              } else if (pr.mergeable === true && has) {
                await github.rest.issues.removeLabel({ owner, repo, issue_number: pr.number, name: 'conflict' }).catch(() => {});
                core.info(`#${pr.number}: conflict cleared`);
              } else core.info(`#${pr.number}: mergeable=${pr.mergeable}`);
            }
