# The Capacitor app shell (roadmap 1.0 M7): builds the game, copies it into the Android and iOS
# projects with `npx cap sync`, and checks that both native apps compile. Debug builds only.
# Nothing is signed and nothing is uploaded to a store. The debug APK is kept as a run artifact
# for 14 days so it can be installed straight on an Android phone (M8).
#
# Separate from CI so the slower native builds run only when the shell or its inputs change.
# Automerge waits on CI only, so a PR that changes the shell should be checked here first.
name: App shell

on:
  pull_request:
    paths:
      - 'android/**'
      - 'ios/**'
      - 'capacitor.config.ts'
      - 'assets/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/app-shell.yml'
      - 'tools/apkplay.cjs'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Capacitor 8 needs JDK 21.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      # Caches Gradle's downloads between runs. The first run on 26 Nov failed on HTTP 429
      # (Too Many Requests) from Maven Central, which rate-limits shared runner addresses.
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
      - run: npm run build
      - run: npx cap sync android
      - name: Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: horders-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

  # Installs the debug APK on an Android emulator and plays one delve with the autopilot inside
  # the app's WebView (the M7 "done when"). Screenshots from the device are kept as a run artifact.
  android-play:
    needs: android
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: horders-debug-apk
          path: apk
      # Only the driver is needed (no browsers): it talks to the app's WebView through adb.
      - run: npm install --prefix "$RUNNER_TEMP/pw" playwright-core@1.63.0
      # Hardware acceleration for the emulator (GitHub's Linux runners have KVM).
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Play a delve on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        env:
          NODE_PATH: ${{ runner.temp }}/pw/node_modules
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: node tools/apkplay.cjs apk/app-debug.apk apk-shots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: horders-emulator-shots
          path: apk-shots
          retention-days: 14
          if-no-files-found: ignore

  ios:
    # Capacitor 8 needs Xcode 26. Public repos get macOS runners free.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: xcodebuild -version
      - run: npm ci
      - run: npm run build
      - run: npx cap sync ios
      - name: Simulator build (unsigned)
        run: >
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug
          -sdk iphonesimulator -destination 'generic/platform=iOS Simulator'
          -derivedDataPath ios/DerivedData CODE_SIGNING_ALLOWED=NO build
